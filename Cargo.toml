[package]
name = "shagadelic"
version = "0.1.0"
description = "Lobby-owned game AI service"
edition = "2024"
publish = false

[features]
washoi = ["dep:futures-util", "dep:shagger_shared", "dep:tokio", "dep:tokio-tungstenite"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shagger_shared = { git = "https://github.com/Higher-Standard-Games/shagger", rev = "350ca05f795999c1a4a570081b7196b7191ada89", optional = true }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"], optional = true }
tokio-tungstenite = { version = "0.30", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }

[lints.rust]
unsafe_code = "deny"
