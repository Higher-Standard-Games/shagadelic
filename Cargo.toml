[package]
name = "shagadelic"
version = "0.1.0"
description = "Lobby-owned game AI service"
edition = "2024"
publish = false

[features]
washoi = ["dep:shagger_shared"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shagger_shared = { git = "https://github.com/Higher-Standard-Games/shagger", rev = "9f1a9b4a300827c48afb5ee3a0c7de478e9d45ff", optional = true }

[lints.rust]
unsafe_code = "deny"
